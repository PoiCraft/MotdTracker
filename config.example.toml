# MotdTracker 最小启动配置
# 仅需提供数据库路径和端口，所有业务配置通过 Web 管理面板完成
# 也可通过环境变量覆盖: MOTDTRACKER_PORT, MOTDTRACKER_DATABASE_PATH, MOTDTRACKER_CORS_ORIGIN

port = 5011

# CORS 允许的源，默认空字符串表示禁止跨域（推荐生产环境保持默认）
# 设置为 "*" 表示允许任意来源（不安全，仅开发测试使用）
# 设置为具体域名如 "https://example.com" 则仅允许该来源
cors_origin = ""

[database]
path = "data/motdtracker.db"
