# MotdTracker 配置文件示例
# 复制此文件为 config.toml 并修改相应配置

# 服务器配置
port = 8080
server_name = "MotdTracker Rust"
poll_interval = 60

# 数据库配置（SQLite）
[database]
path = "data/motdtracker.db"

# 监控节点配置
[[nodes]]
id = 1
name = "Hypixel"
host = "mc.hypixel.net"
port = 25565
enable = true

[[nodes]]
id = 2
name = "CubeCraft"
host = "play.cubecraft.net"
port = 25565
enable = true

[[nodes]]
id = 3
name = "Mineplex"
host = "us.mineplex.com"
port = 25565
enable = false

# NapCat 告警配置（可选）
# [alert.napcat]
# enable = true
# api_url = "http://localhost:3001"
# group_id = 123456789
# offline_threshold = 3
# recovery_threshold = 1

# Umami 分析配置（可选）
# [umami]
# website_id = "your-website-id"
# api_url = "https://analytics.example.com/api"
