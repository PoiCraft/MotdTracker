# MotdTracker 配置文件示例
# 复制此文件为 config.toml 并修改相应配置
# 注意：节点是同一台服务器的不同连接入口，而非不同的服务器

# 服务器配置
port = 8080
server_name = "MotdTracker Rust"
poll_interval = 60

# 前端静态文件目录（默认: frontend/dist）
# static_dir = "frontend/dist"

# 数据库配置（SQLite）
[database]
path = "data/motdtracker.db"

# 节点配置（同一服务器的不同连接入口）
# edition 可选值: java（默认）, bedrock
# Java 版默认端口: 25565，基岩版默认端口: 19132
[[nodes]]
id = 1
name = "主入口"
host = "play.example.com"
port = 25565
edition = "java"
enable = true

[[nodes]]
id = 2
name = "移动优化入口"
host = "mobile.example.com"
port = 25565
edition = "java"
enable = true

[[nodes]]
id = 3
name = "基岩版入口"
host = "play.example.com"
port = 19132
edition = "bedrock"
enable = true

[[nodes]]
id = 4
name = "教育网入口"
host = "edu.example.com"
port = 25565
enable = false

# NapCat 告警配置（可选）
# [alert.napcat]
# enable = true
# api_url = "http://localhost:3001"
# group_id = 123456789
# offline_threshold = 3
# recovery_threshold = 1

# Umami 分析配置（可选）
# [umami]
# website_id = "your-website-id"
# api_url = "https://analytics.example.com/api"
