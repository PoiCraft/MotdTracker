[package]
name = "motdtracker"
version = "1.1.7"
edition = "2021"
authors = ["PoiCraft Team"]
description = "Minecraft server monitoring tool - Rust implementation"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "postgres", "chrono"] }

# Minecraft protocol
async-minecraft-ping = "0.8"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Async
tokio-cron-scheduler = "0.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Prometheus metrics
prometheus = "0.13"

# Badge generation
badge = "0.3"

# WebSocket
axum-extra = { version = "0.9", features = ["typed-header"] }

# Configuration
config = "0.14"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
