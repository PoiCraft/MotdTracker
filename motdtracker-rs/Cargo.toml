[package]
name = "motdtracker"
version = "0.1.0"
edition = "2021"
description = "Minecraft server multi-node real-time monitoring system"
license = "MIT"
authors = ["MotdTracker Team"]
repository = "https://github.com/example/motdtracker-rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros", "ws"] }
axum-extra = { version = "0.9", features = ["typed-header", "query"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "postgres", "chrono", "migrate"] }

# Configuration
toml = "0.8"

# Interactive CLI
dialoguer = "0.11"

# Scheduling
tokio-cron-scheduler = "0.9"

# HTTP client (for alerts)
reqwest = { version = "0.12", features = ["json"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Statistics
statrs = "0.16"

# Async trait
async-trait = "0.1"

# Error handling
thiserror = "1"
anyhow = "1"

# UUID for job IDs
uuid = { version = "1", features = ["v4"] }

# Additional utilities
futures = "0.3"
bytes = "1"
byteorder = "1"

# Template engine (for HTML rendering)
askama = "0.12"

# GraphQL (optional)
async-graphql = { version = "7", optional = true }
async-graphql-axum = { version = "7", optional = true }

# Prometheus metrics (optional)
prometheus = { version = "0.13", optional = true }

[features]
default = ["sqlite"]
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]
graphql = ["async-graphql", "async-graphql-axum"]
prometheus = ["dep:prometheus"]
interactive = []

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[[bin]]
name = "motdtracker"
path = "src/main.rs"
