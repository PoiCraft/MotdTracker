<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if let Some(title) = page_title %}{{ title }}{% else %}MotdTracker{% endif %}</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MotdTracker">
    <meta name="application-name" content="MotdTracker">
    <meta name="description" content="Minecraft 多节点服务器监控面板">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/static/manifest.json">
    
    <!-- Favicon & Apple Touch Icons -->
    <link rel="icon" type="image/png" href="/static/poi.png">
    <link rel="apple-touch-icon" href="/static/icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="72x72" href="/static/icons/icon-72x72.png">
    <link rel="apple-touch-icon" sizes="96x96" href="/static/icons/icon-96x96.png">
    <link rel="apple-touch-icon" sizes="128x128" href="/static/icons/icon-128x128.png">
    <link rel="apple-touch-icon" sizes="144x144" href="/static/icons/icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/static/icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="192x192" href="/static/icons/icon-192x192.png">
    
    <link rel="stylesheet" href="/static/css/style.css">
    {% if umami_enabled %}
    <!-- Umami Analytics -->
    <script defer src="{{ umami_script_url }}"
            data-website-id="{{ umami_website_id }}"
            {% if let Some(domains) = umami_domains %}data-domains="{{ domains }}"{% endif %}></script>
    {% endif %}
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">MotdTracker</div>
        </div>
        <nav class="sidebar-nav">
            <a href="/server" class="nav-link {% if active_page == "server" %}active{% endif %}">服务器</a>
            <a href="/nodes" class="nav-link {% if active_page == "nodes" %}active{% endif %}">节点</a>
            <a href="/players" class="nav-link {% if active_page == "players" %}active{% endif %}">玩家</a>
            <a href="/badges" class="nav-link {% if active_page == "badges" %}active{% endif %}">Badges</a>
            <a href="/api/docs" class="nav-link" target="_blank" rel="noopener">API 文档</a>
            <a href="https://github.com/PoiCraft/MotdTracker" class="nav-link" target="_blank" rel="noopener">
                <svg class="nav-icon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
                </svg>
                GitHub
            </a>
        </nav>
        <div class="sidebar-version">
            <span class="version-text">{{ app_version }}</span>
        </div>
        <div class="sidebar-footer">
            <span id="ws-status" class="ws-status ws-connecting" title="WebSocket连接状态">连接中</span>
            <button id="manual-refresh-btn" class="manual-refresh-btn" title="手动全量刷新" onclick="if(window.manualRefresh) window.manualRefresh()">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>
                    <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/>
                </svg>
            </button>
        </div>
    </div>
    
    <div class="container">
        <div class="header">
            <div class="header-left">
                <button class="mobile-menu-toggle" onclick="toggleSidebar()">☰</button>
            </div>
            <div class="header-right">
            </div>
        </div>

        <div id="content-area">
            <!-- Page content goes here -->
        </div>
    </div>

    <script src="/static/js/socket.io.min.js"></script>
    <script src="/static/js/notifications.js"></script>
    
    <script>
    {% if umami_enabled %}
    // Umami 事件上报辅助函数
    window.trackEvent = function(eventName, eventData) {
        if (typeof umami !== 'undefined' && umami.track) {
            umami.track(eventName, eventData || {});
        }
    };
    {% else %}
    // Umami 未启用时的空函数
    window.trackEvent = function() {};
    {% endif %}

    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        sidebar.classList.toggle('active');
        overlay.classList.toggle('active');
    }
    </script>
</body>
</html>
